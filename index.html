<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Runimate — stick figure animation with node posing, tweening and frame-by-frame drawing.">
  <meta name="theme-color" content="#16171b">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Runimate">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.css">
  <title>Runimate</title>
</head>
<body>
  <header id="topbar"></header>
  <div id="optbar" role="toolbar" aria-label="Tool options"></div>
  <main id="main">
    <nav id="toolbar" aria-label="Tools"></nav>
    <div id="stage-wrap">
      <canvas id="stage-canvas" tabindex="0" aria-label="Animation canvas. Arrow keys pose the selected joint; Tab cycles joints."></canvas>
      <div id="banner" role="status"></div>
    </div>
    <aside id="panel" aria-label="Side panel"></aside>
  </main>
  <footer id="timeline" aria-label="Timeline"></footer>
  <noscript>Runimate needs JavaScript.</noscript>
  <script type="module" src="js/main.js"></script>
</body>
</html>
